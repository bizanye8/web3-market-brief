name: Daily Market Brief

on:
  schedule:
    - cron: "15 1 * * *"   # 09:15 Asia/Shanghai
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/daily-brief.yml"

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate brief
        run: python3 scripts/brief.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs latest.md assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "brief: $(date -u +%Y-%m-%d) market brief"
            git push
          fi
